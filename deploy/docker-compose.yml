services:
  # Django API. Not routed by Traefik on purpose — it is reachable only from
  # georgeai-web on the shared network, which proxies /api/ to it. Keeping
  # nginx at the edge means a broken deploy here cannot take the site down.
  georgeai-app:
    # Paths are relative to the REMOTE layout: this file is deployed to
    # /opt/georgeai/docker-compose.yml, next to ./site, ./backend and ./deploy
    # — not to the deploy/ directory it lives in inside the repo.
    build:
      context: ./backend
    image: georgeai-app:latest
    container_name: georgeai-app
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    expose:
      - "8000"
    networks:
      - gethub-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/auth/me', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  georgeai-web:
    image: nginx:1.27-alpine
    container_name: georgeai-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - georgeai-app
    networks:
      - gethub-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gethub_gethub-network"

      # ---- shared service + redirect middlewares ----
      - "traefik.http.services.georgeai.loadbalancer.server.port=80"
      - "traefik.http.middlewares.georgeai-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.georgeai-https-redirect.redirectscheme.permanent=true"
      # www -> apex. Both hosts used to answer 200 with byte-identical content,
      # which is a duplicate origin: canonical tags mitigate it for Google but
      # every other consumer (AI crawlers, link equity, analytics) sees two
      # sites. $${1} is doubled so docker compose does not eat it as variable
      # interpolation before Traefik ever sees the label.
      - "traefik.http.middlewares.georgeai-www-redirect.redirectregex.regex=^https?://www\\.georgeai\\.dev/(.*)"
      - "traefik.http.middlewares.georgeai-www-redirect.redirectregex.replacement=https://georgeai.dev/$${1}"
      - "traefik.http.middlewares.georgeai-www-redirect.redirectregex.permanent=true"

      # ---- production domain (apex) ----
      - "traefik.http.routers.georgeai-http.rule=Host(`georgeai.dev`)"
      - "traefik.http.routers.georgeai-http.entrypoints=web"
      - "traefik.http.routers.georgeai-http.middlewares=georgeai-https-redirect"
      - "traefik.http.routers.georgeai-http.service=georgeai"
      - "traefik.http.routers.georgeai.rule=Host(`georgeai.dev`)"
      - "traefik.http.routers.georgeai.entrypoints=websecure"
      - "traefik.http.routers.georgeai.tls=true"
      - "traefik.http.routers.georgeai.tls.certresolver=letsencrypt"
      - "traefik.http.routers.georgeai.service=georgeai"

      # ---- www: kept routed (and kept on the cert) purely so it can 301 ----
      # The http router redirects straight to the https apex in one hop rather
      # than bouncing through georgeai-https-redirect first.
      - "traefik.http.routers.georgeai-www-http.rule=Host(`www.georgeai.dev`)"
      - "traefik.http.routers.georgeai-www-http.entrypoints=web"
      - "traefik.http.routers.georgeai-www-http.middlewares=georgeai-www-redirect"
      - "traefik.http.routers.georgeai-www-http.service=georgeai"
      - "traefik.http.routers.georgeai-www.rule=Host(`www.georgeai.dev`)"
      - "traefik.http.routers.georgeai-www.entrypoints=websecure"
      - "traefik.http.routers.georgeai-www.tls=true"
      - "traefik.http.routers.georgeai-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.georgeai-www.middlewares=georgeai-www-redirect"
      - "traefik.http.routers.georgeai-www.service=georgeai"

networks:
  gethub-network:
    external: true
    name: gethub_gethub-network
