server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/ttf font/otf;

    # --- security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- long cache for fingerprinted/static assets ---
    location ~* \.(?:css|js|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # --- HTML: no cache so updates show immediately after redeploy ---
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    # custom error pages if exported by the design tool, else nginx default
    error_page 404 /404.html;
    location = /404.html { internal; }

    # health endpoint for the deploy script
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
