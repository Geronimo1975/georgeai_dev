server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and proxies here over plain http on :80, so nginx
    # builds its own redirects (the trailing-slash 301 from `try_files $uri/`)
    # as http://georgeai.dev/... — a protocol downgrade that costs every
    # slash-less URL an extra hop through Traefik's https redirect, with the
    # first hop in cleartext. Relative Location headers keep the client's
    # scheme and host, which is what we want behind any TLS-terminating edge.
    # Real client IP: Traefik (on the docker network) appends it to
    # X-Forwarded-For; trust only private-network hops so $remote_addr — and the
    # X-Real-IP sent to Django for its sign-in rate limits — is the visitor.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/ttf font/otf;

    # --- Django API (georgeai-app) ---
    # Must be declared before `location /` so the API never falls through to
    # try_files and gets answered with an HTML 404 — that is exactly what made
    # auth.js throw a SyntaxError back when nothing served /api/ at all.
    # No CSP/HSTS headers here: this returns JSON, not documents.
    location /api/ {
        proxy_pass http://georgeai-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django's SECURE_PROXY_SSL_HEADER reads this to know the edge was TLS,
        # which keeps SECURE_SSL_REDIRECT from bouncing every API call.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # --- GeorgeAI Console (georgeai-app) ---
    # Replies stream as SSE for minutes: no proxy buffering, long read timeout.
    # Longest prefix wins over /api/ above.
    location /api/console/ {
        proxy_pass http://georgeai-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # Console pages, Django admin and their assets (whitenoise serves /static/).
    # ^~ so the css/js/image regex blocks below never catch /static/... first.
    # Django sets its own security headers on these responses.
    location ^~ /console/ {
        proxy_pass http://georgeai-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location ^~ /admin/ {
        proxy_pass http://georgeai-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location ^~ /static/ {
        proxy_pass http://georgeai-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The site root is the GeorgeAI Console landing (2026-11-15; before that a
    # 301 to /cinematic/). The export homepage stays at /index.html and
    # /cinematic/, /services/, /blog/, /pricing/ keep serving as before.
    location = / {
        # The console landing (Django): English on georgeai.dev, German on
        # georgeai.de — chosen from the Host header. Marketing pages stay
        # where they were (/cinematic/, /services/, /pricing/, /blog/).
        proxy_pass http://georgeai-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # --- HTML: no cache so updates show immediately after redeploy ---
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Report-Only while we verify against real traffic — see CLAUDE.md for the
        # flip-to-enforced step. unsafe-eval is required: support.js runs Babel-
        # transpiled JSX via `new Function(...)` for the generated-page feature;
        # unsafe-inline on style-src covers the ~490 inline style="" attributes
        # the design-tool export emits (not fingerprintable/hashable across exports).
        # upgrade-insecure-requests is deliberately absent: browsers ignore it in
        # a report-only policy and log an error for it. Add it back when this
        # flips to an enforced Content-Security-Policy header.
        # img-src carries the two icon CDNs the export pulls from — the tech
        # logo strip (cdn.simpleicons.org) and streamlinehq icons. Enforcing
        # without them would blank both. Enumerated across /, /pricing/,
        # /services/, /services/<slug>/ and /blog/ on 2026-08-19.
        # connect-src carries the n8n host because audit.js POSTs the free
        # visibility-audit lead form to https://app.n8n-studio.com/webhook/
        # georgeai-free-audit. Without it an enforced policy kills the widget.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://unpkg.com https://www.googletagmanager.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.simpleicons.org https://assets.streamlinehq.com https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self'; connect-src 'self' https://app.n8n-studio.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    # --- CSS & JS: no-cache because they are not fingerprinted and change on export ---
    location ~* \.(?:css|js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Report-Only while we verify against real traffic — see CLAUDE.md for the
        # flip-to-enforced step. unsafe-eval is required: support.js runs Babel-
        # transpiled JSX via `new Function(...)` for the generated-page feature;
        # unsafe-inline on style-src covers the ~490 inline style="" attributes
        # the design-tool export emits (not fingerprintable/hashable across exports).
        # upgrade-insecure-requests is deliberately absent: browsers ignore it in
        # a report-only policy and log an error for it. Add it back when this
        # flips to an enforced Content-Security-Policy header.
        # img-src carries the two icon CDNs the export pulls from — the tech
        # logo strip (cdn.simpleicons.org) and streamlinehq icons. Enforcing
        # without them would blank both. Enumerated across /, /pricing/,
        # /services/, /services/<slug>/ and /blog/ on 2026-08-19.
        # connect-src carries the n8n host because audit.js POSTs the free
        # visibility-audit lead form to https://app.n8n-studio.com/webhook/
        # georgeai-free-audit. Without it an enforced policy kills the widget.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://unpkg.com https://www.googletagmanager.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.simpleicons.org https://assets.streamlinehq.com https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self'; connect-src 'self' https://app.n8n-studio.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # --- Static assets (images, fonts, media): cached, but not immutable as they aren't fingerprinted ---
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Report-Only while we verify against real traffic — see CLAUDE.md for the
        # flip-to-enforced step. unsafe-eval is required: support.js runs Babel-
        # transpiled JSX via `new Function(...)` for the generated-page feature;
        # unsafe-inline on style-src covers the ~490 inline style="" attributes
        # the design-tool export emits (not fingerprintable/hashable across exports).
        # upgrade-insecure-requests is deliberately absent: browsers ignore it in
        # a report-only policy and log an error for it. Add it back when this
        # flips to an enforced Content-Security-Policy header.
        # img-src carries the two icon CDNs the export pulls from — the tech
        # logo strip (cdn.simpleicons.org) and streamlinehq icons. Enforcing
        # without them would blank both. Enumerated across /, /pricing/,
        # /services/, /services/<slug>/ and /blog/ on 2026-08-19.
        # connect-src carries the n8n host because audit.js POSTs the free
        # visibility-audit lead form to https://app.n8n-studio.com/webhook/
        # georgeai-free-audit. Without it an enforced policy kills the widget.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://unpkg.com https://www.googletagmanager.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.simpleicons.org https://assets.streamlinehq.com https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self'; connect-src 'self' https://app.n8n-studio.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # genuine misses fall through to nginx's built-in 404 page (no custom
    # error_page -> /404.html, which would log a missing-file error per miss)

    # health endpoint for the deploy script
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
