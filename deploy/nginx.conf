server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/ttf font/otf;

    # --- HTML: no cache so updates show immediately after redeploy ---
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Report-Only while we verify against real traffic — see CLAUDE.md for the
        # flip-to-enforced step. unsafe-eval is required: support.js runs Babel-
        # transpiled JSX via `new Function(...)` for the generated-page feature;
        # unsafe-inline on style-src covers the ~490 inline style="" attributes
        # the design-tool export emits (not fingerprintable/hashable across exports).
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    # --- CSS & JS: no-cache because they are not fingerprinted and change on export ---
    location ~* \.(?:css|js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Report-Only while we verify against real traffic — see CLAUDE.md for the
        # flip-to-enforced step. unsafe-eval is required: support.js runs Babel-
        # transpiled JSX via `new Function(...)` for the generated-page feature;
        # unsafe-inline on style-src covers the ~490 inline style="" attributes
        # the design-tool export emits (not fingerprintable/hashable across exports).
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # --- Static assets (images, fonts, media): cached, but not immutable as they aren't fingerprinted ---
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Report-Only while we verify against real traffic — see CLAUDE.md for the
        # flip-to-enforced step. unsafe-eval is required: support.js runs Babel-
        # transpiled JSX via `new Function(...)` for the generated-page feature;
        # unsafe-inline on style-src covers the ~490 inline style="" attributes
        # the design-tool export emits (not fingerprintable/hashable across exports).
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # genuine misses fall through to nginx's built-in 404 page (no custom
    # error_page -> /404.html, which would log a missing-file error per miss)

    # health endpoint for the deploy script
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
