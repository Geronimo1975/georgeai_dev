server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/ttf font/otf;

    # --- HTML: no cache so updates show immediately after redeploy ---
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    # --- CSS & JS: no-cache because they are not fingerprinted and change on export ---
    location ~* \.(?:css|js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # --- Static assets (images, fonts, media): cached, but not immutable as they aren't fingerprinted ---
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # genuine misses fall through to nginx's built-in 404 page (no custom
    # error_page -> /404.html, which would log a missing-file error per miss)

    # health endpoint for the deploy script
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
