{% extends "console/base.html" %}
{% block title %}{{ t.code_title }}{% endblock %}
{% block body %}
<main class="auth">
  <div class="auth-card">
    <a class="brand brand--lg" href="/"><span class="brand-mark" aria-hidden="true"></span>GeorgeAI <span class="brand-sub">Console</span></a>
    <h1>{{ t.code_h1 }}</h1>
    <p class="auth-lede">{{ lede }}</p>
    {% if error %}<div class="auth-error" role="alert" id="auth-error">{{ error }}</div>{% endif %}
    {% if notice %}<div class="auth-notice" role="status">{{ notice }}</div>{% endif %}
    <form method="post" class="auth-form" novalidate>
      {% csrf_token %}
      <input type="hidden" name="a" value="{{ token }}">
      <label class="field">
        <span>{{ t.code_label }}</span>
        <input class="code-input" type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]*" maxlength="7" required autofocus
               {% if error %}aria-invalid="true" aria-describedby="auth-error"{% endif %}>
      </label>
      <button class="btn btn-primary btn-block" type="submit">{{ t.verify }}</button>
    </form>
    <div class="auth-links">
      <form method="post">{% csrf_token %}<input type="hidden" name="a" value="{{ token }}"><button class="link-btn" type="submit" name="resend" value="1">{{ t.resend }}</button></form>
      <a href="/console/login/">{{ t.other_email }}</a>
    </div>
  </div>
</main>
{% endblock %}
