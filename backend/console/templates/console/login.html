{% extends "console/base.html" %}
{% block title %}{{ t.signin_title }}{% endblock %}
{% block body %}
<main class="auth">
  <form class="auth-card" method="post" action="/console/login/" novalidate>
    {% csrf_token %}
    <a class="brand brand--lg" href="/"><span class="brand-mark" aria-hidden="true"></span>GeorgeAI <span class="brand-sub">Console</span></a>
    <h1>{{ t.signin_h1 }}</h1>
    <p class="auth-lede">{{ t.signin_lede }}</p>
    {% if error %}<div class="auth-error" role="alert" id="auth-error">{{ error }}</div>{% endif %}
    <label class="field">
      <span>{{ t.email_label }}</span>
      <input type="email" name="email" autocomplete="email" inputmode="email" required autofocus
             value="{{ email }}" {% if error %}aria-invalid="true" aria-describedby="auth-error"{% endif %}>
    </label>
    <input type="hidden" name="next" value="{{ next|default:'/console/' }}">
    <button class="btn btn-primary btn-block" type="submit">{{ t.send_code }}</button>
    <p class="auth-foot">{{ t.terms }}</p>
  </form>
</main>
{% endblock %}
