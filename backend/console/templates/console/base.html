{% load static %}<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}GeorgeAI Console{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fb5e31'/%3E%3Cpath d='M21 11.5a6.5 6.5 0 1 0 1.2 6.3H16' fill='none' stroke='%2302060a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint (no flash).
    (function () {
      try {
        var t = localStorage.getItem("gai-theme") || "dark";
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="{% static 'console/fonts/plusjakartasans-var-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'console/app.css' %}?v=0.1.2">
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
